name: Update Member Inactivity Status

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      what_if:
        description: "Run without changing org-membership/members.json"
        type: boolean
        required: false
        default: true

concurrency:
  group: org-membership-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-inactivity-status:
    runs-on: ubuntu-latest

    env:
      WHAT_IF: ${{ github.event_name == 'workflow_dispatch' && inputs.what_if == true }}

    steps:
      - name: Create App token
        id: create_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ORG_MEMBER_TEAM_ADMIN_ID }}
          private-key: ${{ secrets.ORG_MEMBER_TEAM_ADMIN_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.create_token.outputs.token }}

      - name: Build active JIT admin list
        id: active_jit
        shell: bash
        run: |
          set -euo pipefail

          active_jit_admins_file="$RUNNER_TEMP/active-jit-admins.txt"
          : > "$active_jit_admins_file"

          parse_request() {
            local file="$1"

            ruby -ryaml -rjson -e '
              file = ARGV.fetch(0)
              data = YAML.safe_load_file(file, aliases: false)

              unless data.is_a?(Hash)
                warn "::error file=#{file}::Request file must contain a YAML object."
                exit 1
              end

              username = data["username"].to_s.strip

              begin
                duration = Integer(data["duration"])
              rescue
                warn "::error file=#{file}::duration must be a whole number of hours."
                exit 1
              end

              if username.empty? || username == "githubUserName"
                warn "::error file=#{file}::username is missing or still set to the template value."
                exit 1
              end

              if duration <= 0
                warn "::error file=#{file}::duration must be greater than 0."
                exit 1
              end

              puts JSON.generate({
                "username" => username,
                "duration" => duration
              })
            ' "$file"
          }

          if [ -d "./org-admin" ]; then
            now_ts="$(date +%s)"

            while IFS= read -r -d '' file; do
              request_json="$(parse_request "$file")"
              username="$(jq -r '.username' <<< "$request_json")"
              duration="$(jq -r '.duration' <<< "$request_json")"

              request_start_ts="$(git log --reverse --format=%ct -- "$file" | head -n 1)"

              if [ -z "$request_start_ts" ]; then
                echo "::warning file=$file::Could not determine request file commit timestamp."
                continue
              fi

              expiration_ts=$(( request_start_ts + duration * 3600 ))

              if [ "$now_ts" -lt "$expiration_ts" ]; then
                echo "$username" >> "$active_jit_admins_file"
              fi
            done < <(find ./org-admin -type f \( -name "*.yml" -o -name "*.yaml" \) -print0)
          fi

          sort -u "$active_jit_admins_file" -o "$active_jit_admins_file"

          echo "Active JIT admins:"
          cat "$active_jit_admins_file" || true

          echo "active_jit_admins_file=$active_jit_admins_file" >> "$GITHUB_OUTPUT"

      - name: Update inactive member statuses
        shell: bash
        run: |
          set -euo pipefail

          MEMBERS_FILE="org-membership/members.json"
          INACTIVE_AFTER_DAYS=90
          ACTIVE_JIT_ADMINS_FILE="${{ steps.active_jit.outputs.active_jit_admins_file }}"

          if [ "$WHAT_IF" = "true" ]; then
            echo "WHAT_IF mode is enabled."
            echo "The workflow will calculate status changes and show a diff, but will not modify $MEMBERS_FILE."
          fi

          if [ ! -f "$MEMBERS_FILE" ]; then
            echo "::error::Members file not found: $MEMBERS_FILE"
            exit 1
          fi

          if [ "$WHAT_IF" = "true" ]; then
            WORKING_MEMBERS_FILE="$(mktemp)"
            cp "$MEMBERS_FILE" "$WORKING_MEMBERS_FILE"
          else
            WORKING_MEMBERS_FILE="$MEMBERS_FILE"
          fi

          export WORKING_MEMBERS_FILE
          export INACTIVE_AFTER_DAYS
          export ACTIVE_JIT_ADMINS_FILE

          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta

          members_file = os.environ["WORKING_MEMBERS_FILE"]
          inactive_after_days = int(os.environ["INACTIVE_AFTER_DAYS"])
          active_jit_admins_file = os.environ["ACTIVE_JIT_ADMINS_FILE"]

          with open(active_jit_admins_file, "r", encoding="utf-8") as file:
              active_jit_admins = {line.strip() for line in file if line.strip()}

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(days=inactive_after_days)

          print(f"Current UTC time: {now.isoformat()}")
          print(f"Inactive cutoff:   {cutoff.isoformat()}")
          print(f"Policy: members with last_public_activity_at older than {inactive_after_days} days are inactive.")
          print("")

          with open(members_file, "r", encoding="utf-8") as file:
              data = json.load(file)

          changed = False

          for member in data.get("members", []):
              username = member.get("username", "<missing username>")
              status = member.get("status")
              last_activity = member.get("last_public_activity_at")

              if status == "nonremovable":
                  print(f"{username}: skipped because status is nonremovable.")
                  continue

              if username in active_jit_admins:
                  print(f"{username}: skipped because user has an active JIT org-admin request.")
                  continue

              if not last_activity:
                  print(f"{username}: skipped because last_public_activity_at is null.")
                  continue

              try:
                  last_activity_dt = datetime.fromisoformat(last_activity.replace("Z", "+00:00"))
              except ValueError:
                  print(f"::warning::{username}: invalid last_public_activity_at value: {last_activity}")
                  continue

              if last_activity_dt < cutoff:
                  if status != "inactive":
                      print(f"{username}: setting status to inactive. Last activity was {last_activity}.")
                      member["status"] = "inactive"
                      changed = True
                  else:
                      print(f"{username}: already inactive. Last activity was {last_activity}.")
              else:
                  if status != "active":
                      print(f"{username}: setting status to active. Last activity was {last_activity}.")
                      member["status"] = "active"
                      changed = True
                  else:
                      print(f"{username}: remains active. Last activity was {last_activity}.")

          if changed:
              with open(members_file, "w", encoding="utf-8") as file:
                  json.dump(data, file, indent=2)
                  file.write("\n")
          else:
              print("")
              print("No status changes were required.")
          PY

          if [ "$WHAT_IF" = "true" ]; then
            echo ""
            echo "WHAT_IF: proposed changes:"
            if diff -u "$MEMBERS_FILE" "$WORKING_MEMBERS_FILE"; then
              echo "WHAT_IF: no changes would be made."
            else
              echo "WHAT_IF: diff shown above. No files were changed."
            fi

            rm -f "$WORKING_MEMBERS_FILE"
          fi

      - name: Commit and push updated JSON
        if: ${{ env.WHAT_IF != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FSDH Org Event Watcher App"
          git config user.email "${{ vars.ORG_MEMBER_TEAM_ADMIN_ID }}[bot]@users.noreply.github.com"

          git add org-membership/members.json

          if git diff --cached --quiet; then
            echo "No inactivity status updates to commit."
          else
            git commit -m "Automated: update member inactivity statuses"
            git push
          fi
