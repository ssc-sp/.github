name: JIT Org Admin

on:
  push:
    branches:
      - main
    paths:
      - "org-admin/**/*.yml"
      - "org-admin/**/*.yaml"

concurrency:
  group: org-membership-state
  cancel-in-progress: false

permissions: read-all

jobs:
  promote-org-admin:
    runs-on: ubuntu-latest
    outputs:
      usernames: ${{ steps.collect.outputs.usernames }}

    steps:
      - name: Create App token
        id: create_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ORG_MEMBER_TEAM_ADMIN_ID }}
          private-key: ${{ secrets.ORG_MEMBER_TEAM_ADMIN_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          gh auth login --with-token <<< "${{ steps.create_token.outputs.token }}"

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Collect Request Files
        id: collect
        shell: bash
        run: |
          set -euo pipefail

          requests_file="$RUNNER_TEMP/org-admin-requests.json"
          export REQUESTS_FILE="$requests_file"

          ruby -ryaml -rjson -e '
            files = Dir.glob(["./org-admin/**/*.yml", "./org-admin/**/*.yaml"]).sort

            requests = files.map do |file|
              puts "Processing file: #{file}"

              data = YAML.safe_load_file(file, aliases: false)

              unless data.is_a?(Hash)
                warn "::error file=#{file}::Request file must contain a YAML object."
                exit 1
              end

              username = data["username"].to_s.strip
              reason = data["reason"].to_s.strip

              begin
                duration = Integer(data["duration"])
              rescue
                warn "::error file=#{file}::duration must be a whole number of hours."
                exit 1
              end

              if username.empty? || username == "githubUserName"
                warn "::error file=#{file}::username is missing or still set to the template value."
                exit 1
              end

              if duration <= 0
                warn "::error file=#{file}::duration must be greater than 0."
                exit 1
              end

              if reason.empty?
                warn "::error file=#{file}::reason is required."
                exit 1
              end

              {
                "file" => file,
                "username" => username,
                "duration" => duration,
                "reason" => reason
              }
            end

            File.write(ENV.fetch("REQUESTS_FILE"), JSON.pretty_generate(requests))
          '

          if [ ! -s "$requests_file" ]; then
            echo "No YAML request files found."
            echo "usernames=" >> "$GITHUB_OUTPUT"
            echo "requests_file=$requests_file" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          usernames="$(jq -r 'map(.username) | join(",")' "$requests_file")"

          echo "Usernames to promote: $usernames"
          echo "usernames=$usernames" >> "$GITHUB_OUTPUT"
          echo "requests_file=$requests_file" >> "$GITHUB_OUTPUT"

      - name: Promote Users to Org Admin
        id: promote_admin
        shell: bash
        run: |
          set -euo pipefail

          requests_file="${{ steps.collect.outputs.requests_file }}"

          if [ ! -s "$requests_file" ]; then
            echo "No users to promote."
            exit 0
          fi

          jq -c '.[]' "$requests_file" | while IFS= read -r request; do
            username="$(jq -r '.username' <<< "$request")"
            duration="$(jq -r '.duration' <<< "$request")"
            reason="$(jq -r '.reason' <<< "$request")"
            source_file="$(jq -r '.file' <<< "$request")"

            echo "Processing user: $username"
            echo "Request file: $source_file"
            echo "Requested duration: $duration hour(s)"
            echo "Reason: $reason"

            member_status="$(
              curl -L -s -o /dev/null -w "%{http_code}" \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ steps.create_token.outputs.token }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/orgs/${{ github.repository_owner }}/members/$username"
            )"

            if [ "$member_status" != "204" ]; then
              echo "User $username is not a member of the organization. Skipping."
              continue
            fi

            gh api \
              --method PUT \
              "/orgs/${{ github.repository_owner }}/memberships/$username" \
              --field role=admin \
              --silent

            echo "User $username has been promoted to org admin for $duration hour(s)."
          done
